[workspace]
resolver = "3"
members = ["agent", "model"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
alaya-model = { path = "model" }
async-stream = "0.3"
async-trait = "0.1.89"
bytes = "1.11.1"
chrono = { version = "0.4.44", features = ["serde"] }
dotenv = "0.15.0"
futures = "0.3.32"
glob = "0.3"
regex = "1"
reqwest = { version = "0.13.2", features = ["json", "gzip", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
